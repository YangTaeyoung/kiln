name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check
        run: cargo check --locked -p kiln
      - name: Localization coverage and font tests
        run: |
          python3 scripts/test-check-localizations.py
          python3 scripts/check-localizations.py
          cargo test --locked -p kiln-common -p kiln-i18n-macros
      - name: Native IME cancellation regression
        run: cargo test --locked -p egui-winit --lib kiln_ime_tests
      - name: Native IME commit and trigger regression
        run: cargo test --locked -p kiln --test native_ime
      - name: Daemon protocol, palette and foreground identity regressions
        run: |
          cargo test --locked -p kiln-proto
          cargo test --locked -p kiln-daemon --lib
      - name: Application unit tests
        run: |
          cargo test --locked -p kiln --lib
          cargo test --locked -p kiln-accounts --lib
      - name: Remote files and direct agent launches
        run: |
          cargo test --locked -p kiln-remote --lib --test transfers --test s3_pagination --test aws_profile_ui -- --test-threads=1
          cargo test --locked -p kiln --test direct_terminal_launch -- --test-threads=1
          cargo test --locked -p kiln --test terminal_recovery -- --test-threads=1
      - name: SQL completion and SQLite regressions
        run: |
          cargo test --locked -p kiln-db --lib
          cargo test --locked -p kiln-db --test sqlite_backend --test config_store --test splitter --test schema_changes
          cargo test --locked -p kiln-db --test sql_completion -- --test-threads=1
      - name: Schema UI and editor regressions
        run: |
          cargo test --locked -p kiln-db --test schema_ui_flow -- --test-threads=1
          cargo test --locked -p kiln-editor --tests
      - name: Git integration tests
        run: cargo test --locked -p kiln-git
      - name: GUI and session integration
        run: |
          cargo test --locked -p kiln --test gui
          cargo test --locked -p kiln --test pane_layout -- --test-threads=1
          cargo test --locked -p kiln --test portable_icons
      - name: Validate release scripts
        run: |
          bash -n scripts/bundle-macos.sh scripts/release-macos.sh
          python3 -m py_compile scripts/fetch-sparkle.py scripts/sign-framework.py scripts/make-appcast.py scripts/collect-licenses.py
