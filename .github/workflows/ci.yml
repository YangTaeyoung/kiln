name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Cargo commands select the whole workspace; --lib and --test choose the targets that run.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - name: Localization coverage and font tests
        run: |
          python3 scripts/test-check-localizations.py
          python3 scripts/check-localizations.py
          python3 scripts/test-make-appcast.py
      - name: Library unit tests
        run: KILN_PTY_HOST=0 cargo nextest run --locked --profile ci --workspace --lib
      - name: Native IME regressions
        run: |
          members=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(" ".join("-p " + p["name"] for p in json.load(sys.stdin)["packages"]))')
          cargo test --locked $members -p egui-winit --lib kiln_ime_tests
          cargo test --locked --workspace --test native_ime
      - name: Integration tests
        run: |
          tests=$(for f in crates/kiln-editor/tests/*.rs crates/kiln-git/tests/*.rs; do printf -- '--test %s ' "$(basename "$f" .rs)"; done)
          cargo nextest run --locked --profile ci --workspace $tests --test macos_responsibility --test transfers --test s3_pagination --test aws_profile_ui --test ssh_profile_ui --test object_profile_ui --test direct_terminal_launch --test shell_completion --test terminal_recovery --test hosted --test hosted_failures --test sqlite_backend --test config_store --test splitter --test schema_changes --test result_edit --test sql_completion --test query_execution --test schema_ui_flow --test gui --test remote_inspector --test workflow_distill --test pane_layout --test portable_icons
          KILN_PTY_HOST=0 cargo nextest run --locked --profile ci --workspace --test daemon
          cargo test --locked --workspace --test mixed_upgrade
      - name: Validate release scripts
        run: |
          sh -n install.sh
          bash -n scripts/bundle-macos.sh scripts/release-macos.sh
          python3 -m py_compile scripts/fetch-sparkle.py scripts/sign-framework.py scripts/make-appcast.py scripts/collect-licenses.py scripts/configure-network-privacy.py scripts/prepare-updater-test.py
          python3 scripts/test-network-privacy.py

  windows:
    name: ${{ matrix.target.name }} ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
        part: [libraries, crates, terminal]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          if ! command -v rustup >/dev/null; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl -fsSLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.name }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'libraries' }}
      - name: Library tests
        if: matrix.part == 'libraries'
        run: cargo test --locked --no-fail-fast --workspace --lib -- --test-threads=1
      - name: Credential Manager
        if: matrix.part == 'libraries' && !cancelled()
        run: |
          status=0
          cargo test --locked --workspace --lib -- --ignored --exact store::tests::windows_store_keeps_kiln_snapshots_in_files_and_other_entries_in_credential_manager || status=1
          npm install --global @openai/codex@0.162.1 || status=1
          home="$RUNNER_TEMP/codex-keyring"
          mkdir -p "$home"
          printf 'cli_auth_credentials_store = "keyring"\n[features]\nsecret_auth_storage = false\n' > "$home/config.toml"
          printf 'ci-fixture-key' | CODEX_HOME="$home" codex login --with-api-key || status=1
          KILN_CODEX_KEYRING_HOME="$home" cargo test --locked --workspace --lib -- --ignored --exact codex::tests::the_entry_the_cli_writes_is_read_under_its_key || status=1
          CODEX_HOME="$home" codex logout || true
          exit $status
      - name: Editor, Git, database and remote integration
        if: matrix.part == 'crates'
        run: |
          status=0
          tests=$(for f in crates/kiln-editor/tests/*.rs crates/kiln-git/tests/*.rs; do printf -- '--test %s ' "$(basename "$f" .rs)"; done)
          cargo test --locked --no-fail-fast --workspace $tests -- --test-threads=1 || status=1
          cargo test --locked --no-fail-fast --workspace --test sqlite_backend --test config_store --test splitter --test schema_changes --test result_edit --test sql_completion --test query_execution --test schema_ui_flow -- --test-threads=1 || status=1
          cargo test --locked --no-fail-fast --workspace --test transfers --test s3_pagination --test aws_profile_ui --test ssh_profile_ui --test object_profile_ui -- --test-threads=1 || status=1
          exit $status
      - name: GUI integration
        if: matrix.part == 'crates' && !cancelled()
        run: cargo test --locked --no-fail-fast --workspace --test gui --test remote_inspector --test workflow_distill --test portable_icons --test widgets_visual --test fullscreen --test glyphs -- --test-threads=1
      - name: Terminal and daemon integration
        if: matrix.part == 'terminal'
        run: cargo test --locked --no-fail-fast --workspace --test hosted --test daemon --test lifecycle_reliability --test notification_visibility --test recovery_navigation -- --test-threads=1

  database-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kiln_fixture_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kiln_fixture_only
          MYSQL_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pkiln_fixture_only"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: kiln_fixture_only
          MARIADB_ROOT_HOST: '%'
        ports: [3307:3306]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: SELECT editing on disposable PostgreSQL, MySQL and MariaDB
        env:
          KILN_TEST_PG_URL: postgres://postgres:kiln_fixture_only@127.0.0.1:5432/postgres
          KILN_TEST_MYSQL_URL: mysql://root:kiln_fixture_only@127.0.0.1:3306/mysql
          KILN_TEST_MARIA_URL: mariadb://root:kiln_fixture_only@127.0.0.1:3307/mysql
        run: cargo test --locked -p kiln-db --test result_edit_servers -- --test-threads=1 --nocapture
