name: Verify 0.2.17 Windows archives

# Verification branch ONLY. Reuse the registered workflow path without changing
# main's packaging workflow, the release source, or any published artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Final release version
        required: true
        default: '0.2.17'
      package_run_id:
        description: Explicit final packaging run ID supplied by the maintainer
        required: true
      expected_x64_sha256:
        description: SHA256 of the final locally downloaded x64 ZIP
        required: true
      expected_arm64_sha256:
        description: SHA256 of the final locally downloaded ARM64 ZIP
        required: true
      release_url:
        description: Optional public repository or release-page URL for a post-publication installer check
        required: false

permissions:
  contents: read
  actions: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      VERIFY_VERSION: ${{ inputs.version }}
      VERIFY_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      VERIFY_X64_SHA256: ${{ inputs.expected_x64_sha256 }}
      VERIFY_ARM64_SHA256: ${{ inputs.expected_arm64_sha256 }}
      VERIFY_RELEASE_URL: ${{ inputs.release_url }}
    steps:
      # Default checkout selects this verification branch and its scripts.
      - uses: actions/checkout@v4
      - name: Validate verification inputs and installer source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/verify/0.2.17' -or $env:VERIFY_VERSION -ne '0.2.17') {
            throw 'Run only verify/0.2.17 for version 0.2.17'
          }
          if ($env:VERIFY_PACKAGE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Invalid packaging run ID' }
          foreach ($digest in @($env:VERIFY_X64_SHA256, $env:VERIFY_ARM64_SHA256)) {
            if ($digest -notmatch '^[0-9a-fA-F]{64}$') { throw 'Both final SHA256 inputs are required' }
          }
          # Unchanged installer baseline: 45ebc98d3db654c9ce0d1738f29d17d68e7ac9a7
          $installerBlob = git rev-parse HEAD:install.ps1
          if ($LASTEXITCODE -ne 0 -or $installerBlob -ne '0b52314b293a0fed0471dc740eb93d5cbeaef593') {
            throw 'install.ps1 differs from the release source'
          }
          foreach ($file in @('install.ps1', 'scripts/verify-windows-release.ps1')) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id }}
          pattern: kiln-windows-*
          path: archives
          merge-multiple: true
      - name: Assert final archive digests before starting any mirror or installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = foreach ($arch in @('x64', 'arm64')) {
            $name = "Kiln-$($env:VERIFY_VERSION)-windows-$arch.zip"
            $expected = if ($arch -eq 'x64') { $env:VERIFY_X64_SHA256 } else { $env:VERIFY_ARM64_SHA256 }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'archives' $name) -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "Final archive digest mismatch: $name" }
            Write-Host "$name SHA256 $($actual.ToLowerInvariant()) PASS"
            "$($expected.ToLowerInvariant())  $name"
          }
          $lines | Set-Content -LiteralPath archives/SHA256SUMS.txt -Encoding ascii
      - name: Verify final archives through the unchanged installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = @{
            Version = $env:VERIFY_VERSION
            NativeArch = '${{ matrix.arch }}'
            ExpectedX64Sha256 = $env:VERIFY_X64_SHA256
            ExpectedArm64Sha256 = $env:VERIFY_ARM64_SHA256
          }
          if ($env:VERIFY_RELEASE_URL) {
            ./scripts/verify-windows-release.ps1 -Mirror $env:VERIFY_RELEASE_URL @verify
          } else {
            $archives = (Resolve-Path archives).Path
            $portFile = Join-Path $env:RUNNER_TEMP ('kiln-mirror-' + [Guid]::NewGuid().ToString('N'))
            $server = [Diagnostics.Process]::new()
            $server.StartInfo = [Diagnostics.ProcessStartInfo]::new('python')
            $server.StartInfo.UseShellExecute = $false
            foreach ($argument in @('scripts/release-archive-mirror.py', $archives, $portFile, '--version', $env:VERIFY_VERSION)) {
              $server.StartInfo.ArgumentList.Add($argument)
            }
            if (!$server.Start()) { throw 'Mirror did not start' }
            try {
              $deadline = (Get-Date).AddSeconds(20)
              while (!(Test-Path -LiteralPath $portFile)) {
                if ($server.HasExited -or (Get-Date) -gt $deadline) { throw 'Mirror did not become ready' }
                Start-Sleep -Milliseconds 100
              }
              $port = (Get-Content -LiteralPath $portFile -Raw).Trim()
              if ($port -notmatch '^[0-9]+$') { throw 'Invalid mirror port' }
              ./scripts/verify-windows-release.ps1 -Mirror "http://127.0.0.1:$port" @verify
            } finally {
              if (!$server.HasExited) { $server.Kill(); $server.WaitForExit() }
              $server.Dispose()
              Remove-Item -LiteralPath $portFile -ErrorAction SilentlyContinue
            }
          }
