name: Release (Windows)

# Builds the Windows archives of a release tag. The maintainer signs them with the update
# key on the Mac and attaches them to the draft release (docs/maintainers/releases.md).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build, such as v0.2.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release-windows.yml
      - scripts/package-windows.ps1

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install stable Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl -fsSLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target ${{ matrix.target }} -OutDir dist
      # Code signing through SignPath Foundation (free for open source) once the project is
      # approved. Fill in the organization ID and slugs from the SignPath project.
      # - name: Sign
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<organization-id>'
      #     project-slug: 'kiln'
      #     signing-policy-slug: 'release-signing'
      #     artifact-configuration-slug: 'windows-zip'
      #     github-artifact-id: '<artifact id of the unsigned upload>'
      #     wait-for-completion: true
      #     output-artifact-directory: 'dist/signed'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kiln-${{ matrix.name }}
          path: dist/Kiln-*.zip
          if-no-files-found: error
