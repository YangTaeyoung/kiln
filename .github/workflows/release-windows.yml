name: Windows release candidate runtime verification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: JSON containing the package run ID and the two signatures
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: kiln-windows-${{ matrix.arch }}
          run-id: ${{ fromJSON(inputs.ref).run }}
          github-token: ${{ github.token }}
          path: release-qa/mirror
      - name: Install twice and run the 0.2.23 updater against the signed 0.2.24 archive
        shell: pwsh
        env:
          KILN_QA_ARCH: ${{ matrix.arch }}
          KILN_QA_SIGNATURE: ${{ fromJSON(inputs.ref)[matrix.arch] }}
        run: ./release-qa/verify.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.arch }}
          path: release-qa/evidence/*
          if-no-files-found: ignore
