name: Verify 0.2.15 Windows archives
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release source commit
        required: true
      release_url:
        description: Optional public release URL instead of the local mirror
        required: false
permissions:
  contents: read
  actions: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40117109764
          pattern: kiln-windows-*
          path: archives
          merge-multiple: true
      - name: Verify final archives through the installer
        shell: pwsh
        env:
          KILN_VERIFY_URL: ${{ inputs.release_url }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:KILN_VERIFY_URL) {
            ./scripts/verify-windows-release.ps1 -Mirror $env:KILN_VERIFY_URL -NativeArch '${{ matrix.arch }}'
            exit 0
          }
          $archives=(Resolve-Path archives).Path
          Copy-Item scripts/0.2.15-SHA256SUMS.txt (Join-Path $archives 'SHA256SUMS.txt')
          $portFile=Join-Path $env:RUNNER_TEMP 'kiln-mirror-port'
          $server=Start-Process python -ArgumentList @('scripts/release-archive-mirror.py',$archives,$portFile) -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(20)
            while(!(Test-Path $portFile)) {
              if($server.HasExited -or (Get-Date) -gt $deadline){throw 'Mirror did not start'}
              Start-Sleep -Milliseconds 100
            }
            $port=(Get-Content $portFile -Raw).Trim()
            ./scripts/verify-windows-release.ps1 -Mirror "http://127.0.0.1:$port" -NativeArch '${{ matrix.arch }}'
          } finally {if(!$server.HasExited){Stop-Process -Id $server.Id}}
