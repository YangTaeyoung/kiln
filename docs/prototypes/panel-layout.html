<!-- THESIS: demonstrate pane movement and smart alignment through direct manipulation.

STORY: move a pane, align independent splits, then resize their shared axis.

<header class="top"><div><h1>패널 배치 검토</h1></div><span class="stamp">동작 목업 · 실제 터미널과 연결되지 않음</span></header>
<section class="controls" aria-label="검토 옵션"><div class="presets"><button data-preset="offset" aria-pressed="true">엇갈린 4분할</button><button data-preset="aligned" aria-pressed="false">정렬된 4분할</button><button data-preset="thirds" aria-pressed="false">3열</button><button data-preset="halves" aria-pressed="false">2분할</button></div><div class="switches"><label><input type="checkbox" id="guides" checked>정렬 보조선</label><label><input type="checkbox" id="snap" checked>스냅</label><label><input type="checkbox" id="linked" checked>교차점 연동</label></div><div class="tools"><button id="undo">되돌리기</button><button id="theme">밝은 테마</button><button id="full">넓게 보기</button></div></section>
<section class="frame"><aside><h2>작업 공간</h2><div class="ws">personal<small>동작 검토용 예시</small></div><div class="task"><span class="dot"></span>프론트엔드 개선<small>Codex · 작업 중</small></div><div class="task"><span class="dot orange"></span>API 연결<small>Claude · 작업 중</small></div><div class="task">통합 테스트<small>터미널 · 대기</small></div></aside><main class="stage"><div class="toolbar"><strong style="font-size:12px">personal</strong><span id="summary">4개 패널</span></div><div id="workspace" class="workspace" aria-label="조작 가능한 패널 배치"></div></main></section>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script>
'use strict';
const board=document.querySelector('#workspace'),status=document.querySelector('#status');
const GAP=8,MIN=90,THRESHOLD=18,SNAP_RELEASE=30,JOIN_ZONE=64;
const clone=x=>JSON.parse(JSON.stringify(x));
const L=id=>({id}),S=(axis,ratio,a,b)=>({axis,ratio,a,b});
let tree=S('x',.5,S('y',.5,L('a'),L('b')),S('y',.58,L('c'),L('d'))),preset='offset',drag=null,selected='a',history=[],rects=[],bars=[];
const paneData={a:{name:'프론트엔드 개선',agent:'codex',lines:[['good','• 구성 요소 확인 완료'],['code','src/components/Workspace.tsx'],['body','패널 이동과 정렬 동작을 점검합니다.'],['muted','테스트 결과: 12 passed'],['',''] ]},b:{name:'통합 테스트',agent:'terminal',lines:[['','$ npm run test'],['good','✓ Layout / resize / drag'],['good','✓ 세션 ID 유지'],['muted','새 입력을 기다리는 중'] ]},c:{name:'API 연결',agent:'claude',lines:[['warn','✳ 작업 중'],['body','프론트와 API 연결을 확인합니다.'],['code','GET /api/workspaces'],['good','200 OK'],['muted','연결 상태 검증 완료'] ]},d:{name:'문서 정리',agent:'codex',lines:[['good','• 사용자 흐름 확인'],['code','docs/workspaces.md'],['body','분할선을 맞추면 하나의 축으로 조절됩니다.'],['muted','동작 목업의 예시 콘텐츠입니다.'] ]}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mark(agent){if(agent==='claude')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5M8 3l8 18M3 8l18 8M3 16l18-8M8 21l8-18"/></svg>';if(agent==='codex')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m7 8 4 4-4 4M13 16h5"/></svg>';return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 6 6-6 6M13 18h7"/></svg>'}
function layout(node,r,path='root'){
 if(node.id){rects.push({id:node.id,...r});return}
 const vertical=node.axis==='x',size=vertical?r.w:r.h,first=(size-GAP)*node.ratio,coordinate=(vertical?r.x:r.y)+first+GAP/2;
 const bar={path,node,axis:node.axis,parent:r,coordinate,x:vertical?r.x+first:r.x,y:vertical?r.y:r.y+first,w:vertical?GAP:r.w,h:vertical?r.h:GAP};bars.push(bar);
 const a={...r},b={...r};if(vertical){a.w=first;b.x=r.x+first+GAP;b.w=size-first-GAP}else{a.h=first;b.y=r.y+first+GAP;b.h=size-first-GAP}
 layout(node.a,a,path+'.a');layout(node.b,b,path+'.b');
}
function measure(root){const savedRects=rects,savedBars=bars;rects=[];bars=[];layout(root,{x:0,y:0,w:board.clientWidth,h:board.clientHeight});const result=rects;rects=savedRects;bars=savedBars;return result}
function minimum(node,axis){if(node.id)return MIN;const a=minimum(node.a,axis),b=minimum(node.b,axis);return node.axis===axis?Math.max(a/node.ratio,b/(1-node.ratio))+GAP:Math.max(a,b)}
function presetTree(kind){return kind==='thirds'?S('x',1/3,L('a'),S('x',.5,L('c'),L('b'))):kind==='halves'?S('x',.5,L('a'),L('c')):S('x',.5,S('y',.5,L('a'),L('b')),S('y',kind==='aligned'?.5:.58,L('c'),L('d')))}
function canTranspose(node){return !node.id&&!node.a.id&&!node.b.id&&node.a.axis===node.b.axis&&node.a.axis!==node.axis&&Math.abs(node.a.ratio-node.b.ratio)<.00001}
function transposed(node){return S(node.a.axis,node.a.ratio,S(node.axis,node.ratio,node.a.a,node.b.a),S(node.axis,node.ratio,node.a.b,node.b.b))}
function replaceNode(path,node){if(path==='root')tree=node;else{const parts=path.split('.'),key=parts.pop();getNode(parts.join('.'))[key]=node}}
function localSegment(path,p,apply=false,independent=false){const bar=bars.find(b=>b.path===path);if(!bar||!canTranspose(bar.node))return null;const tangent=bar.axis==='x'?p.y:p.x,start=bar.axis==='x'?bar.parent.y:bar.parent.x,size=bar.axis==='x'?bar.parent.h:bar.parent.w,cross=start+(size-GAP)*bar.node.a.ratio+GAP/2;const proximity=document.querySelector('#linked').checked&&!independent?JOIN_ZONE:20;if(Math.abs(tangent-cross)<=proximity)return null;const candidate=transposed(bar.node),child=tangent<cross?'a':'b';if(apply){replaceNode(path,candidate);geometry()}return{path:path+'.'+child,candidate,bar}}
function related(a,b){return a===b||a.startsWith(b+'.')||b.startsWith(a+'.')}
function geometry(){rects=[];bars=[];layout(tree,{x:0,y:0,w:board.clientWidth,h:board.clientHeight})}
function styleRect(el,r){Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'})}
function render(){geometry();board.innerHTML='';for(const r of rects){const data=paneData[r.id],p=document.createElement('section');p.className='pane'+(r.id===selected?' selected':'');p.dataset.id=r.id;styleRect(p,r);p.innerHTML=`<div class="pane-header" tabindex="0" aria-label="${esc(data.name)} 패널 머리글"><span class="grip" aria-hidden="true">⋮⋮</span><span class="mark agent-${data.agent}">${mark(data.agent)}</span><span class="pane-title">${esc(data.name)}</span><span class="panel-actions" aria-hidden="true">⊞ ⋮ ×</span></div><div class="terminal">${data.lines.map(([type,line])=>`<div class="line ${type}">${esc(line)||'&nbsp;'}</div>`).join('')}</div><div class="prompt">${data.agent==='terminal'?'❯ 명령 입력':'› 요청 입력'}</div>`;p.addEventListener('pointerdown',()=>selected=r.id);p.querySelector('.pane-header').addEventListener('pointerdown',e=>startPane(e,r.id));board.append(p)}
 for(const bar of bars){const el=document.createElement('div');el.className='splitter '+(bar.axis==='x'?'v':'h');el.dataset.path=bar.path;el.tabIndex=0;el.setAttribute('role','separator');el.setAttribute('aria-orientation',bar.axis==='x'?'vertical':'horizontal');el.setAttribute('aria-label','분할선 조절');el.setAttribute('aria-valuenow',Math.round(bar.node.ratio*100));styleRect(el,bar);el.addEventListener('pointerdown',e=>startResize(e,bar.path));el.addEventListener('keydown',e=>keyboardResize(e,bar.path));board.append(el)}
 renderJunctions();document.querySelectorAll('[data-preset]').forEach(button=>button.setAttribute('aria-pressed',JSON.stringify(tree)===JSON.stringify(presetTree(button.dataset.preset))));document.querySelector('#summary').textContent=rects.length+'개 패널';document.querySelector('#undo').disabled=!history.length;
}
function getNode(path,root=tree){return path.split('.').slice(1).reduce((node,k)=>node[k],root)}
function point(e){const r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function startPane(e,id){if(e.button!==0)return;e.preventDefault();selected=id;drag={type:'pane',id,start:point(e),active:false,snapshot:clone(tree),pointerId:e.pointerId};status.textContent='다른 패널의 가장자리로 드래그하세요.';render()}
function adjacent(a,b){if(a.axis!==b.axis)return false;const [amin,amax,bmin,bmax]=a.axis==='x'?[a.parent.y,a.parent.y+a.parent.h,b.parent.y,b.parent.y+b.parent.h]:[a.parent.x,a.parent.x+a.parent.w,b.parent.x,b.parent.x+b.parent.w];return Math.abs(amax-bmin)<=GAP+2||Math.abs(bmax-amin)<=GAP+2}
function junction(a,b){if(!adjacent(a,b)||Math.abs(a.coordinate-b.coordinate)>1||related(a.path,b.path))return null;const start=a.axis==='x'?'y':'x',size=a.axis==='x'?'h':'w';const ends=[a.parent[start]+a.parent[size],b.parent[start]+b.parent[size]],begins=[a.parent[start],b.parent[start]];const tangent=Math.abs(ends[0]-begins[1])<=GAP+2?(ends[0]+begins[1])/2:(ends[1]+begins[0])/2;return a.axis==='x'?{x:a.coordinate,y:tangent}:{x:tangent,y:a.coordinate}}
function junctionContains(p,q){const dx=Math.abs(p.x-q.x),dy=Math.abs(p.y-q.y);return(dx<=4&&dy<=20)||(dy<=4&&dx<=20)}

function renderJunctions(){if(!document.querySelector('#linked').checked)return;const seen=new Set();for(let i=0;i<bars.length;i++)for(let j=i+1;j<bars.length;j++){const point=junction(bars[i],bars[j]);if(!point)continue;const key=point.x+':'+point.y+':'+bars[i].axis;if(seen.has(key))continue;seen.add(key);const el=document.createElement('button');el.className='junction '+(bars[i].axis==='x'?'v':'h');el.style.left=point.x+'px';el.style.top=point.y+'px';el.dataset.path=bars[i].path;el.setAttribute('aria-label','교차점: 맞춰진 경계 함께 조절');el.addEventListener('pointerdown',e=>startJunction(e,bars[i].path,point));el.addEventListener('keydown',e=>keyboardResize(e,bars[i].path,true));board.append(el)}}
function resizeGroup(path,p,forceLinked=false){const bar=bars.find(b=>b.path===path),linked=[path];if(!bar)return linked;const near=forceLinked||bars.some(other=>{const q=junction(bar,other);return q&&Math.hypot(p.x-q.x,p.y-q.y)<=JOIN_ZONE});if(document.querySelector('#linked').checked&&near){let changed=true;while(changed){changed=false;for(const other of bars){if(linked.includes(other.path)||Math.abs(other.coordinate-bar.coordinate)>1)continue;if(bars.filter(b=>linked.includes(b.path)).some(b=>junction(b,other))){linked.push(other.path);changed=true}}}}return linked}
function clearResizePreview(){board.querySelectorAll('.boundary-preview,.resize-region').forEach(el=>el.remove())}
function highlightResize(paths){clearResizePreview();const group=bars.filter(b=>paths.includes(b.path));if(!group.length)return;const bar=group[0],vertical=bar.axis==='x',parents=group.map(b=>b.parent),region={x:Math.min(...parents.map(r=>r.x)),y:Math.min(...parents.map(r=>r.y))};region.w=Math.max(...parents.map(r=>r.x+r.w))-region.x;region.h=Math.max(...parents.map(r=>r.y+r.h))-region.y;const area=document.createElement('div');area.className='resize-region';styleRect(area,region);board.append(area);const strip=document.createElement('div');strip.className='boundary-preview '+(vertical?'v':'h');styleRect(strip,vertical?{x:bar.coordinate-GAP/2,y:region.y,w:GAP,h:region.h}:{x:region.x,y:bar.coordinate-GAP/2,w:region.w,h:GAP});board.append(strip)}
function highlightJunction(path,q){if(!document.querySelector('#linked').checked){highlightResize([path]);return}highlightResize(resizeGroup(path,q,true));const strip=board.querySelector('.boundary-preview'),area=board.querySelector('.resize-region');if(!strip||!area)return;const r={x:parseFloat(area.style.left),y:parseFloat(area.style.top),w:parseFloat(area.style.width),h:parseFloat(area.style.height)},x=q.x-r.x,y=q.y-r.y;styleRect(strip,r);strip.style.background=`linear-gradient(to right,transparent ${x-GAP/2}px,#91b4ff88 ${x-GAP/2}px,#91b4ff88 ${x+GAP/2}px,transparent ${x+GAP/2}px),linear-gradient(to bottom,transparent ${y-GAP/2}px,#91b4ff88 ${y-GAP/2}px,#91b4ff88 ${y+GAP/2}px,transparent ${y+GAP/2}px)`;strip.style.boxShadow='none';}
function hoverResize(e){const p=point(e);let hit=bars.find(bar=>p.x>=bar.x&&p.x<=bar.x+bar.w&&p.y>=bar.y&&p.y<=bar.y+bar.h);if(document.querySelector('#linked').checked&&!e.altKey){for(const bar of bars){const other=bars.find(other=>{const q=junction(bar,other);return q&&junctionContains(p,q)});if(other){highlightJunction(bar.path,junction(bar,other));return}}}if(e.altKey){const button=e.target?.closest?.('.junction');if(button)hit=bars.find(bar=>bar.path===button.dataset.path)}if(!hit){clearResizePreview();return}const virtual=localSegment(hit.path,p,false,e.altKey);if(virtual){const oldTree=tree,oldRects=rects,oldBars=bars;tree=clone(tree);replaceNode(hit.path,virtual.candidate);geometry();highlightResize([virtual.path]);tree=oldTree;rects=oldRects;bars=oldBars}else highlightResize(e.altKey?[hit.path]:resizeGroup(hit.path,p))}
function startJunction(e,path,q){if(e.button!==0)return;if(e.altKey||!document.querySelector('#linked').checked){startResize(e,path);return}e.preventDefault();const bar=bars.find(b=>b.path===path),cross=bars.find(b=>b.axis!==bar.axis&&Math.abs(b.coordinate-(b.axis==='x'?q.x:q.y))<1&&q.x>=b.x-1&&q.x<=b.x+b.w+1&&q.y>=b.y-1&&q.y<=b.y+b.h+1);drag={type:'junction',path,crossPath:cross?.path,start:point(e),snapshot:clone(tree),pointerId:e.pointerId};highlightJunction(path,q);status.textContent='가로 또는 세로 방향으로 드래그하면 전체 경계가 움직입니다.'}

function startResize(e,path){if(e.button!==0)return;e.preventDefault();geometry();const snapshot=clone(tree),virtual=!e.forceLinked&&!e.keyboard&&localSegment(path,point(e),true,e.altKey);if(virtual)path=virtual.path;const bar=bars.find(b=>b.path===path),linked=resizeGroup(path,point(e),e.forceLinked);
 drag={type:'resize',path,axis:bar.axis,snapshot,originalBars:bars.map(b=>({...b,parent:{...b.parent}})),linked,pointerId:e.pointerId};highlightResize(e.altKey?[path]:linked);status.textContent=linked.length>1?'교차점에서 '+linked.length+'개 경계를 함께 조절합니다.':'이 영역의 분할선만 조절합니다.';
}
function fractions(r,axis,scope){const start=axis==='x'?r.x:r.y,size=axis==='x'?r.w:r.h;return [[.25,'¼'],[1/3,'⅓'],[.5,'½ · 가운데'],[2/3,'⅔'],[.75,'¾']].map(([f,label])=>({coordinate:start+size*f,label:label+(scope?' · '+scope:''),type:'fraction'}))}
function resize(e){const d=drag,pos=point(e),bar=d.originalBars.find(b=>b.path===d.path),raw=d.axis==='x'?pos.x:pos.y,independent=!!e.altKey;
 const paths=independent?[d.path]:d.linked,all=paths.map(p=>d.originalBars.find(b=>b.path===p));
 let min=-Infinity,max=Infinity;for(const b of all){const start=d.axis==='x'?b.parent.x:b.parent.y,size=d.axis==='x'?b.parent.w:b.parent.h;const a=minimum(b.node.a,d.axis),z=minimum(b.node.b,d.axis);min=Math.max(min,start+a+GAP/2);max=Math.min(max,start+size-z-GAP/2)}
 const candidates=[...fractions({x:0,y:0,w:board.clientWidth,h:board.clientHeight},d.axis,'전체'),...d.originalBars.filter(b=>b.axis===d.axis&&!paths.some(p=>related(p,b.path))&&adjacent(bar,b)).map(b=>({coordinate:b.coordinate,label:'다른 패널과 정렬',type:'neighbor'}))];
 const nearby=candidates.filter(c=>c.coordinate>=min&&c.coordinate<=max).map(c=>({...c,distance:Math.abs(c.coordinate-raw)})).filter(c=>c.distance<=THRESHOLD).sort((a,b)=>a.distance-b.distance||(a.type==='neighbor'?-1:1))[0];
 const snapEnabled=document.querySelector('#snap').checked&&!independent&&!e.disableSnap,held=snapEnabled&&d.snapTarget&&d.snapTarget.coordinate>=min&&d.snapTarget.coordinate<=max&&Math.abs(d.snapTarget.coordinate-raw)<=SNAP_RELEASE?d.snapTarget:null;d.snapTarget=snapEnabled?(held||nearby||null):null;const target=d.snapTarget,guided=target||nearby;let coordinate=target?target.coordinate:Math.min(max,Math.max(min,raw));
 for(const b of all){const node=getNode(b.path),start=d.axis==='x'?b.parent.x:b.parent.y,size=d.axis==='x'?b.parent.w:b.parent.h;node.ratio=(coordinate-start-GAP/2)/(size-GAP)}
 render();if(document.querySelector('#guides').checked&&guided&&!independent)guide(d.axis,guided.coordinate,!!target);
 highlightResize(paths);if(target){board.querySelector('.boundary-preview')?.classList.add('snapped');board.querySelector('.resize-region')?.classList.add('snapped')}
 status.textContent=(guided&&!independent?guided.label:'자유 조절')+(paths.length>1?' · '+paths.length+'개 축 연동':'');
}
function guide(axis,coordinate,snapped=false){const el=document.createElement('div');el.className='guide '+(axis==='x'?'v':'h')+(snapped?' snapped':'');el.setAttribute('aria-hidden','true');el.style[axis==='x'?'left':'top']=coordinate+'px';board.append(el)}
function paneMove(e){const d=drag,p=point(e);if(!d.active&&Math.hypot(p.x-d.start.x,p.y-d.start.y)<7)return;d.active=true;board.querySelectorAll('.drop-preview').forEach(e=>e.remove());board.querySelector(`[data-id="${d.id}"]`)?.classList.add('dragging');
 let ghost=document.querySelector('.ghost');if(!ghost){ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=paneData[d.id].name;document.body.append(ghost)}ghost.style.left=e.clientX+15+'px';ghost.style.top=e.clientY+15+'px';
 const target=rects.find(r=>r.id!==d.id&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h);d.target=null;if(!target)return;
 const distances=[['left',(p.x-target.x)/target.w],['right',(target.x+target.w-p.x)/target.w],['top',(p.y-target.y)/target.h],['bottom',(target.y+target.h-p.y)/target.h]].sort((a,b)=>a[1]-b[1]);const edge=distances[0][0],candidate=insert(detach(tree,d.id),target.id,d.id,edge),measured=measure(candidate),preview=measured.find(r=>r.id===d.id);if(measured.some(r=>r.w<MIN||r.h<MIN)){const blocked=document.createElement('div');blocked.className='drop-preview blocked';styleRect(blocked,preview);board.append(blocked);status.textContent='이 위치에는 패널 공간이 부족합니다.';return}
 d.target={id:target.id,edge};const label={left:'왼쪽에 배치',right:'오른쪽에 배치',top:'위에 배치',bottom:'아래에 배치'}[edge],el=document.createElement('div');el.className='drop-preview';styleRect(el,preview);board.append(el);status.textContent=paneData[target.id].name+' · '+label;
}
function detach(node,id){if(node.id)return node.id===id?null:node;const a=detach(node.a,id),b=detach(node.b,id);return !a?b:!b?a:{...node,a,b}}
function insert(node,target,id,edge){if(node.id){if(node.id!==target)return node;const first=edge==='left'||edge==='top';return S(edge==='left'||edge==='right'?'x':'y',.5,L(first?id:target),L(first?target:id))}return {...node,a:insert(node.a,target,id,edge),b:insert(node.b,target,id,edge)}}
function pointerMove(e){if(!drag){hoverResize(e);return}if(e.pointerId!==drag.pointerId)return;if(drag.type==='junction'){const d=drag,p=point(e),dx=Math.abs(p.x-d.start.x),dy=Math.abs(p.y-d.start.y);if(Math.max(dx,dy)<4)return;const chosen=bars.find(b=>b.path===d.path),axis=dx>dy?'x':'y',path=chosen.axis===axis?d.path:d.crossPath;if(!path)return;startResize({button:0,preventDefault(){},clientX:e.clientX,clientY:e.clientY,forceLinked:true,altKey:e.altKey,pointerId:e.pointerId},path);drag.snapshot=d.snapshot;resize(e)}else if(drag.type==='resize')resize(e);else paneMove(e)}
function pointerUp(e){if(!drag||e.pointerId!==drag.pointerId)return;const d=drag;if(d.type==='pane'&&d.active&&d.target){const candidate=insert(detach(tree,d.id),d.target.id,d.id,d.target.edge),old=tree;tree=candidate;geometry();if(rects.some(r=>r.w<MIN||r.h<MIN)){tree=old;status.textContent='패널 공간이 부족합니다. 넓게 보기에서 다시 시도하세요.'}else{history.push(d.snapshot);status.textContent='패널 위치를 옮겼습니다. 예시 세션은 유지됩니다.'}}
 else if(d.type==='resize'&&JSON.stringify(tree)!==JSON.stringify(d.snapshot)){history.push(d.snapshot);status.textContent='분할 크기를 적용했습니다.'}else if(d.type==='pane'){status.textContent='패널 이동을 취소했습니다.'}

}
function cancel(){if(!drag)return;tree=drag.snapshot;drag=null;document.querySelector('.ghost')?.remove();render();status.textContent='변경을 취소했습니다.'}
function keyboardResize(e,path,forceLinked=false){const bar=bars.find(b=>b.path===path);const negative=bar.axis==='x'?e.key==='ArrowLeft':e.key==='ArrowUp',positive=bar.axis==='x'?e.key==='ArrowRight':e.key==='ArrowDown';if(!negative&&!positive)return;e.preventDefault();startResize({button:0,preventDefault(){},altKey:e.altKey,pointerId:-1,forceLinked,keyboard:true,clientX:0,clientY:0},path);const rect=board.getBoundingClientRect(),value=bar.coordinate+(positive?18:-18);resize({clientX:rect.left+(bar.axis==='x'?value:bar.parent.x),clientY:rect.top+(bar.axis==='y'?value:bar.parent.y),altKey:e.altKey,disableSnap:true});pointerUp({pointerId:-1});board.querySelector(forceLinked?`.junction[data-path="${path}"]`:`.splitter[data-path="${path}"]`)?.focus();status.textContent='키보드로 분할 크기를 조절했습니다.'}
document.querySelector('#linked').addEventListener('change',()=>{cancel();render()});
board.addEventListener('pointerleave',()=>{if(!drag)clearResizePreview()});window.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerUp);window.addEventListener('pointercancel',cancel);window.addEventListener('keydown',e=>{if(e.key==='Escape')cancel()});
for(const button of document.querySelectorAll('[data-preset]'))button.addEventListener('click',()=>{cancel();history.push(clone(tree));preset=button.dataset.preset;tree=preset==='thirds'?S('x',1/3,L('a'),S('x',.5,L('c'),L('b'))):preset==='halves'?S('x',.5,L('a'),L('c')):S('x',.5,S('y',.5,L('a'),L('b')),S('y',preset==='aligned'?.5:.58,L('c'),L('d')));document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b===button));render();status.textContent=preset==='aligned'?'교차점 손잡이는 함께, 떨어진 가로·세로선은 따로 움직여 보세요.':preset==='offset'?'오른쪽 가로 분할선을 왼쪽 높이에 맞춰 보세요.':'전체 작업 영역의 ¼ · ⅓ · ½ 지점으로 움직여 보세요.'});
document.querySelector('#undo').addEventListener('click',()=>{cancel();if(history.length){tree=history.pop();render();status.textContent='직전 배치로 되돌렸습니다.'}});
document.querySelector('#theme').addEventListener('click',e=>{document.body.classList.toggle('dark-off');e.currentTarget.textContent=document.body.classList.contains('dark-off')?'어두운 테마':'밝은 테마'});
document.querySelector('#full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('aside').hidden=!document.querySelector('aside').hidden;render()}});
new ResizeObserver(()=>{if(drag)cancel();render()}).observe(board);render();
window.kilnPrototype={state:()=>clone(tree),geometry:()=>{geometry();return{panes:clone(rects),dividers:bars.map(({path,axis,coordinate,parent})=>({path,axis,coordinate,parent}))}},reset:()=>document.querySelector('[data-preset=offset]').click()};
