[package]
name = "kiln"
version.workspace = true
edition.workspace = true
default-run = "kiln"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
kiln-proto.workspace = true
kiln-daemon.workspace = true
kiln-common.workspace = true
kiln-editor.workspace = true
kiln-git.workspace = true
kiln-db.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
postcard.workspace = true
arboard = "3"
regex = "1"
open = "5"
rfd = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tempfile.workspace = true
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
