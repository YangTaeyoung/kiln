[package]
name = "kiln"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kiln"

[features]
# Dedicated native Sparkle fixtures only; never enable in a distribution build.
updater-test = []

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
kiln-proto.workspace = true
kiln-daemon.workspace = true
kiln-common.workspace = true
kiln-editor.workspace = true
kiln-git.workspace = true
kiln-db.workspace = true
kiln-accounts.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
postcard.workspace = true
arboard = "3"
regex = "1"
unicode-width = "0.2.2"
open = "5"
rfd = "0.17"
global-hotkey = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tempfile.workspace = true
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSApplication", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSImage", "NSButton", "NSControl", "NSResponder", "NSView", "NSCell"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSArray", "NSThread", "NSTimer", "NSDate", "NSString"] }
