[package]
name = "kiln-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time", "sync", "macros"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
suppaftp = { version = "7", default-features = false, features = ["native-tls"] }
url = "2"
percent-encoding = "2"
quick-xml = { version="0.38", features=["serialize"] }
chrono = { version="0.4", default-features=false, features=["std"] }
kiln-accounts.workspace = true
glob = "0.3"
egui.workspace = true
kiln-common.workspace = true
kiln-editor.workspace = true
rfd = "0.17"

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { workspace = true, features = ["wgpu"] }

image = { version = "0.25", default-features = false, features = ["png"] }
