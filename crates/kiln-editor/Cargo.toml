[package]
name = "kiln-editor"
version.workspace = true
edition.workspace = true

[dependencies]
kiln-common.workspace = true
egui.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
nucleo-matcher = "0.3"
ignore = "0.4"
notify = "8"
trash = "5"
regex = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "kiln-fake-lsp"
path = "tests/support/fake_lsp.rs"
test = false
doc = false

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile.workspace = true
